name: GPUI Desktop (macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'crates/host-client/**'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/host-client/**'
      - '.github/workflows/desktop-macos.yml'

jobs:
  check-native:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check GPUI app against pinned Zed revision
        run: cargo check --manifest-path apps/desktop/Cargo.toml
      - name: Unit test shared Host client
        run: cargo test --workspace
