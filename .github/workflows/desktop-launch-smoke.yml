name: GPUI Desktop window launch smoke

# Real native-window launch evidence, not a build-only check:
#   - macOS: the Desktop process must own a CoreGraphics layer-0 window.
#   - Linux: the Desktop process must own a viewable X11 window under Xvfb.
# Both jobs also prove that terminating the Desktop does not stop the Host.
# Windows interactive-desktop evidence is NOT established by this workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'scripts/ci/gpui-launch-smoke-*.sh'
      - 'scripts/ci/window_probe.swift'
      - '.github/workflows/desktop-launch-smoke.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/ci/gpui-launch-smoke-*.sh'
      - 'scripts/ci/window_probe.swift'
      - '.github/workflows/desktop-launch-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-window:
    name: macOS window launch
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Launch smoke with CGWindowList evidence
        run: bash scripts/ci/gpui-launch-smoke-macos.sh
      - name: Upload Desktop, Host and probe logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-smoke-logs
          if-no-files-found: ignore
          path: |
            target/launch-smoke/macos/**

  linux-x11-window:
    name: Linux X11 window launch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install X11, GPU and windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libudev-dev \
            xvfb xdotool x11-utils libxcb-shape0 libxcb-xkb1 \
            mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgles2 \
            fonts-dejavu-core
      - name: Launch smoke under Xvfb with xdotool evidence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            bash scripts/ci/gpui-launch-smoke-x11.sh
      - name: Upload Desktop, Host and probe logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-smoke-logs
          if-no-files-found: ignore
          path: |
            target/launch-smoke/x11/**
