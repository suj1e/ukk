name: Release (unsigned)

# Builds unsigned desktop installers and an unsigned iOS device-build IPA.
# Never signs, notarizes, publishes a GitHub Release, or uploads to a store.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            artifact: ukk-macos
          - os: windows-latest
            target: windows/amd64
            artifact: ukk-windows
          - os: ubuntu-latest
            target: linux/amd64
            artifact: ukk-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/desktop/go.sum

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Install makensis for the Windows installer
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install makensis; else sudo apt-get install -y nsis; fi

      - name: Test
        working-directory: apps/desktop
        shell: bash
        run: |
          gofmt_output="$(gofmt -l .)"
          if [ -n "$gofmt_output" ]; then echo "$gofmt_output"; exit 1; fi
          go vet ./...
          go test ./...

      - name: Build the macOS input helper
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/resources/darwin
          swiftc -O -target arm64-apple-macos13 -o "$RUNNER_TEMP/ukk-input-arm64" apps/desktop/tools/ukk-input/main.swift
          swiftc -O -target x86_64-apple-macos13 -o "$RUNNER_TEMP/ukk-input-x86_64" apps/desktop/tools/ukk-input/main.swift
          lipo -create "$RUNNER_TEMP/ukk-input-arm64" "$RUNNER_TEMP/ukk-input-x86_64" -output apps/desktop/resources/darwin/ukk-input
          chmod +x apps/desktop/resources/darwin/ukk-input

      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "${version}" ] || [ "${version}" = "${GITHUB_REF_NAME}" ]; then
            version="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi
          go tool mygo build -platform '${{ matrix.target }}' -o ../../dist/desktop
          printf '%s\n' "${version}" > ../../dist/desktop/VERSION.txt

      - name: Build bridge and relay binaries
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dist/desktop/bin
          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
          go build -trimpath -o "../../dist/desktop/bin/ukk-bridge${suffix}" ./cmd/ukk-bridge
          go build -trimpath -o "../../dist/desktop/bin/ukk-relay${suffix}" ./cmd/ukk-relay
          "./../../dist/desktop/bin/ukk-bridge${suffix}" --version
          "./../../dist/desktop/bin/ukk-relay${suffix}" --version

      - name: Verify package
        working-directory: dist/desktop
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f | sort
          case '${{ runner.os }}' in
            macOS)
              test -d */*.app || test -d */*/*.app
              ;;
            Windows)
              test -n "$(find . -name '*setup*.exe' -print -quit)"
              ;;
            Linux)
              test -n "$(find . -name '*.deb' -print -quit)"
              test -n "$(find . -name '*.tar.gz' -print -quit)"
              ;;
          esac

      - name: Checksums
        working-directory: dist/desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.')
          lines = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              # MyGo's internal manifest is hidden and excluded from uploaded
              # artifacts; checksumming it would make the downloaded set fail.
              if path.name == '.mygo-files':
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.as_posix()}")
          pathlib.Path('SHA256SUMS.txt').write_text("\n".join(lines) + "\n", encoding='utf-8', newline='\n')
          print(f"checksums for {len(lines)} files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/desktop
          if-no-files-found: error
          retention-days: 14

  ios-unsigned-ipa:
    name: iOS unsigned device-build IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch WebRTC binary
        working-directory: apps/ios
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-webrtc.sh

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if xcodebuild -project UkkCompanion.xcodeproj -scheme UkkCompanion -resolvePackageDependencies; then
              exit 0
            fi
            echo "package resolution failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Archive without signing
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project UkkCompanion.xcodeproj \
            -scheme UkkCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UkkCompanion.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p ipa/Payload
          cp -R UkkCompanion.xcarchive/Products/Applications/UkkCompanion.app ipa/Payload/
          (cd ipa && zip -qry ../ukk-unsigned.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/dist/ios"
          cp ukk-unsigned.ipa "$GITHUB_WORKSPACE/dist/ios/"
          cat > "$GITHUB_WORKSPACE/dist/ios/README.txt" <<'EOF'
          Unsigned device-build IPA for inspection only.
          It is not signed, cannot be installed on an iPhone, and must not be
          presented as a TestFlight, App Store, or installable build.
          EOF
          shasum -a 256 "$GITHUB_WORKSPACE/dist/ios/ukk-unsigned.ipa" \
            > "$GITHUB_WORKSPACE/dist/ios/ukk-unsigned.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ukk-ios-unsigned-ipa
          path: dist/ios
          if-no-files-found: error
          retention-days: 14
