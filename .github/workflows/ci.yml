name: CI

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/ios/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'DEVELOPMENT.md'
      - 'REVIEW.md'
      - 'CONTRIBUTING.md'
      - 'LESSONS.md'
      - 'justfile'
      - '.github/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/ios/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'DEVELOPMENT.md'
      - 'REVIEW.md'
      - 'CONTRIBUTING.md'
      - 'LESSONS.md'
      - 'justfile'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check repository documentation
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_versions.py
      - name: Run packaging self-test
        run: python3 scripts/test_package_release.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run unit and mock protocol tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
