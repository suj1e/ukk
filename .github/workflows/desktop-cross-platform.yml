name: GPUI Desktop native cross-platform build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'crates/host-client/**'
      - '.github/workflows/desktop-cross-platform.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/host-client/**'
      - '.github/workflows/desktop-cross-platform.yml'

jobs:
  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Linux GPU and windowing build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libfontconfig1-dev libfreetype-dev libvulkan-dev libudev-dev
      - name: Compile GPUI native Desktop for host OS
        run: cargo check --manifest-path apps/desktop/Cargo.toml
      - name: Validate shared Host client
        run: cargo test -p ukk-host-client
