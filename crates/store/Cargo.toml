[package]
name = "ukk-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite-backed durable ukk workspace metadata, not herdr-core runtime ownership"

[dependencies]
ukk-domain = { path = "../domain" }
ukk-protocol = { path = "../protocol" }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde_json = "1"
uuid = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
