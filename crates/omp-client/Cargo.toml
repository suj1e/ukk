[package]
name = "ukk-omp-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Typed newline-delimited JSON RPC client for omp RPC mode"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deterministic mock child used only by this crate's integration tests. It is
# a bin target (not shipped) because Cargo exposes `CARGO_BIN_EXE_*` only for
# executable targets of the same package.
[[bin]]
name = "ukk-omp-mock-rpc"
path = "src/bin/mock_rpc.rs"
