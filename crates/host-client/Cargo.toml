[package]
name = "ukk-host-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local read-only IPC client for ukk Agent Host"

[dependencies]
serde_json = "1.0"
ukk-domain = { path = "../domain" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
] }
