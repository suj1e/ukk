[package]
name = "ukk-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Versioned remote Host protocol: envelopes, durable cursors, device grants and authorization"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
