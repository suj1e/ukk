[package]
name = "ukk-media"
version = "0.1.0"
edition = "2021"
publish = false
description = "Versioned Remote Screen signalling contract, grants and controller leases"

[dependencies]
ukk-protocol = { path = "../protocol" }
# Already used by every protocol/remote crate. Both are MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
