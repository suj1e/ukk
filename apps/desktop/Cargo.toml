[package]
name = "ukk-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental native GPUI shell for ukk Agent Workspace"

# Standalone workspace: root CI remains lightweight, while GPUI's large
# platform dependency graph can be independently validated on macOS.
[workspace]
resolver = "2"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["font-kit", "wayland", "x11"] }
ukk-host-client = { path = "../../crates/host-client" }
ukk-domain = { path = "../../crates/domain" }
ukk-worktree = { path = "../../crates/worktree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
