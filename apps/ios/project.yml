name: UkkCompanion
options:
  bundleIdPrefix: dev.ukk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: "150.7871.05"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  UkkCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UkkCompanion
    dependencies:
      - package: LiveKitWebRTC
        product: LiveKitWebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ukk.companion
        PRODUCT_NAME: UkkCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ukk
        INFOPLIST_KEY_NSCameraUsageDescription: "ukk uses the camera only to scan a Desktop pairing QR code."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ukk connects to the paired Desktop's screen relay on the local network when you open Remote Screen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  UkkCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UkkCompanionTests
    dependencies:
      - target: UkkCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ukk.companion.tests
        GENERATE_INFOPLIST_FILE: YES
  UkkCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UkkCompanionUITests
    dependencies:
      - target: UkkCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ukk.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UkkCompanion
schemes:
  UkkCompanion:
    build:
      targets:
        UkkCompanion: all
        UkkCompanionTests: [test]
        UkkCompanionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: UkkCompanionTests
        - name: UkkCompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
