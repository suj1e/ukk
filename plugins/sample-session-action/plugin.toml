# Sample ukk plugin — schema v1.
#
# Harmless by construction: it contributes a Session action, a Session tab and
# a floating overlay descriptor, all bound to one declared command, and uses no
# privileged capability. Declared capabilities grant nothing on their own; the
# optional `session.observe` only becomes usable after a user grant.
#
# `entrypoint` is a bare helper name. The installer resolves it to an absolute
# path (crates/plugin-host builds `ukk-sample-session-helper`) and pins that
# path in the install record; a manifest cannot choose a program to execute.
manifest_version = 1
id = "dev.ukk.sample.session-action"
name = "Sample Session Action"
version = "0.1.0"
api = ">=0.1,<0.2"
trust = "first-party"
entrypoint = "ukk-sample-session-helper"

[capabilities]
required = []
optional = ["session.observe"]

[[contributions.commands]]
id = "sample.session.ping"
title = "Sample: ping this session"
description = "Returns a fixed pong with the session id. Touches no OS resource."
scope = "session"
requires = []

[[contributions.views]]
id = "sample.session.action"
slot = "session.action"
title = "Sample action"
command = "sample.session.ping"

[[contributions.views]]
id = "sample.session.tab"
slot = "session.tab"
title = "Sample"
command = "sample.session.ping"

[[contributions.views]]
id = "sample.session.overlay"
slot = "session.overlay"
title = "Sample overlay"
command = "sample.session.ping"

[contributions.views.overlay]
anchor = "top-right"
max_width = 320
max_height = 240

[[contributions.events]]
id = "sample.session-events"
kinds = ["session.updated"]
